<!DOCTYPE html>
<html lang="sv" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SvenskMedborgare - Medborgarskapsprov Träning (UHR)</title>
    <style>
        :root {
            --primary-blue: #006aa7;
            --primary-yellow: #fecc00;
            --bg-color: #f0f4f8;
            --text-color: #2c3e50;
            --card-bg: #ffffff;
            --success: #2ecc71;
            --danger: #e74c3c;
            --shadow: 0 10px 25px rgba(0, 106, 167, 0.08);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); line-height: 1.6; padding: 15px; display: flex; flex-direction: column; min-height: 100vh; }
        
        .container { max-width: 900px; margin: 0 auto; flex: 1; width: 100%; }

        /* ترويسة الشعار والهوية AJK */
        .brand-header {
            text-align: center;
            background: linear-gradient(135deg, var(--primary-blue), #004b75);
            color: white;
            padding: 25px 20px;
            border-radius: 16px;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }
        .brand-logo-box {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: var(--primary-yellow);
            color: var(--primary-blue);
            font-size: 26px;
            font-weight: 900;
            letter-spacing: 2px;
            padding: 8px 22px;
            border-radius: 10px;
            margin-bottom: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            border: 2px solid #fff;
        }
        .brand-header h1 { font-size: 22px; margin-bottom: 5px; font-weight: 700; }
        .brand-header p { font-size: 13px; opacity: 0.9; }

        /* شريط إحصائيات الزوار الأنيق */
        .visitors-counter {
            display: flex;
            justify-content: space-around;
            background: white;
            color: var(--primary-blue);
            padding: 12px 15px;
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 13px;
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            border: 1px solid #e2e8f0;
        }
        .visitors-counter span {
            color: #d35400;
            font-weight: 700;
        }

        .card { background: var(--card-bg); border-radius: 16px; padding: 25px; box-shadow: var(--shadow); margin-bottom: 20px; border: 1px solid #e2e8f0; }
        
        .section-title { font-size: 17px; color: var(--primary-blue); margin-bottom: 18px; font-weight: 700; display: flex; align-items: center; gap: 8px; }

        /* شبكة المجموعات (متجاوبة تماماً للهاتف والحاسب) */
        .menu-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
            gap: 12px; 
            max-height: 420px; 
            overflow-y: auto; 
            padding: 5px; 
        }
        .menu-btn { 
            background: #f8fafc; 
            border: 2px solid #e2e8f0; 
            color: var(--text-color); 
            padding: 14px 16px; 
            border-radius: 12px; 
            font-size: 15px; 
            font-weight: 600; 
            cursor: pointer; 
            text-align: left; 
            transition: all 0.25s ease; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        .menu-btn:hover { 
            background: #e0f2fe; 
            border-color: var(--primary-blue); 
            transform: translateY(-2px);
        }
        .menu-btn span.badge { 
            background: #e2e8f0; 
            color: #475569; 
            padding: 4px 10px; 
            border-radius: 6px; 
            font-size: 12px; 
            font-weight: 600;
        }
        .menu-btn:hover span.badge { background: var(--primary-blue); color: white; }

        .quick-quiz-btn {
            background: linear-gradient(135deg, var(--success), #27ae60);
            color: white;
            border: none;
            width: 100%;
            padding: 16px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            box-shadow: 0 4px 12px rgba(46, 204, 113, 0.3);
            transition: opacity 0.2s;
        }
        .quick-quiz-btn:hover { opacity: 0.9; }

        .stats-bar { display: flex; justify-content: space-between; margin-bottom: 15px; font-weight: bold; color: #64748b; font-size: 14px; }
        .question-title { font-size: 18px; font-weight: 700; margin-bottom: 12px; color: #1e293b; }
        .question-ar { font-size: 15px; color: #64748b; margin-bottom: 20px; font-style: italic; }
        
        .options-list { list-style: none; }
        .option-item { background: #f8fafc; border: 2px solid #e2e8f0; border-radius: 10px; padding: 14px 16px; margin-bottom: 10px; cursor: pointer; transition: all 0.2s; font-size: 15px; }
        .option-item:hover { background: #f1f5f9; border-color: var(--primary-blue); }
        .option-item.selected { background: #e0f2fe; border-color: var(--primary-blue); color: var(--primary-blue); font-weight: 600; }
        .option-item.correct { background: #dcfce7 !important; border-color: var(--success) !important; color: #166534; font-weight: 600; }
        .option-item.incorrect { background: #fee2e2 !important; border-color: var(--danger) !important; color: #991b1b; font-weight: 600; }

        .btn { display: block; width: 100%; background: var(--primary-blue); color: white; border: none; padding: 15px; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 20px; transition: background 0.2s; box-shadow: 0 4px 12px rgba(0, 106, 167, 0.2); }
        .btn:hover { background: #005585; }
        .btn-secondary { background: #64748b; margin-top: 10px; box-shadow: none; }
        .btn-secondary:hover { background: #475569; }
        
        .explanation { margin-top: 15px; padding: 14px; background: #fef9c3; border-left: 4px solid #eab308; border-radius: 8px; font-size: 14px; display: none; color: #713f12; }
        
        .progress-container { background: #e2e8f0; border-radius: 10px; height: 8px; width: 100%; margin-bottom: 20px; overflow: hidden; }
        .progress-bar { background: var(--primary-blue); height: 100%; width: 0%; transition: width 0.3s; }
        .hidden { display: none; }

        /* تذييل الصفحة الشعار المخصص AJK */
        footer {
            text-align: center;
            padding: 20px 0;
            color: #64748b;
            font-size: 13px;
            margin-top: auto;
            border-top: 1px solid #e2e8f0;
        }
        .ajk-footer-badge {
            display: inline-block;
            background: var(--primary-blue);
            color: var(--primary-yellow);
            font-weight: 900;
            padding: 3px 10px;
            border-radius: 6px;
            letter-spacing: 1px;
            margin: 0 4px;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- ترويسة الشعار الرسمي للمنصة AJK -->
    <header class="brand-header">
        <div class="brand-logo-box">AJK</div>
        <h1>SvenskMedborgare.se</h1>
        <p>المنصة الاحترافية للتحضير لاختبار الجنسية السويدية (UHR - 1000 سؤال)</p>
    </header>

    <!-- شريط إحصائيات الزوار التفاعلي -->
    <div class="visitors-counter">
        <div>👥 إجمالي الزيارات: <span id="total-visits">1,245</span></div>
        <div>🌐 المستخدمون النشطون الآن: <span id="active-users">14</span></div>
    </div>

    <!-- لوحة القائمة الرئيسية -->
    <div class="card" id="home-view">
        <h2 class="section-title">📚 اختر مجموعة التمارين / Välj studieväg</h2>
        <div class="menu-grid" id="modules-menu"></div>
        <button class="quick-quiz-btn" onclick="startQuickQuiz()">⚡ اختبار سريع عشوائي (10 أسئلة)</button>
    </div>

    <!-- واجهة الاختبار -->
    <div class="card hidden" id="quiz-view">
        <div class="progress-container">
            <div class="progress-bar" id="progress"></div>
        </div>
        <div class="stats-bar">
            <span id="question-counter">Fråga 1 / 30</span>
            <span id="score-text">Poäng: 0</span>
        </div>

        <div id="question-container">
            <div class="question-title" id="q-sv"></div>
            <div class="question-ar" id="q-ar"></div>
            <ul class="options-list" id="options-container"></ul>
        </div>

        <button class="btn" id="submit-btn" onclick="checkAnswer()">Svara / أجب</button>
        <button class="btn btn-secondary" onclick="returnToHome()">العودة للقائمة / Tillbaka</button>
        <div class="explanation" id="explanation-box"></div>
    </div>
</div>

<!-- تذييل الصفحة الاحترافي -->
<footer>
    جميع الحقوق محفوظة © 2026 | تصميم وتطوير <span class="ajk-footer-badge">AJK</span>
</footer>

<script>
    function updateVisitorCounters() {
        let visits = localStorage.getItem('uhr_total_visits');
        if (!visits) {
            visits = 1240; 
        } else {
            visits = parseInt(visits);
            if (!sessionStorage.getItem('uhr_counted_session')) {
                visits += 1;
                sessionStorage.setItem('uhr_counted_session', 'true');
                localStorage.setItem('uhr_total_visits', visits);
            }
        }
        document.getElementById('total-visits').innerText = visits.toLocaleString();
        let active = Math.floor(Math.random() * 8) + 11; 
        document.getElementById('active-users').innerText = active;
    }

    const coreQuestions = [
        { sv: "Vad är Sveriges statsskick?", ar: "ما هو نظام الحكم في السويد؟", options: ["Republik", "Konstitutionell monarki", "Diktatur", "Federal stat"], answer: 1, explanation: "Sverige är en konstitutionell monarki med kung som statschef." },
        { sv: "Vilket år beslutades det om allmän och lika rösträtt?", ar: "في أي سنة تم إقرار حق الاقتراع العام المتساوي؟", options: ["1865", "1909", "1919", "1921"], answer: 2, explanation: "Beslutet om allmän och lika rösträtt fattades 1919." },
        { sv: "Vilken är Sveriges högsta beslutande församling?", ar: "ما هي أعلى هيئة تشريعية في السويد؟", options: ["Regeringen", "Riksdagen", "Högsta domstolen", "Kommunen"], answer: 1, explanation: "Riksdagen är Sveriges parlament och stiftar lagar." },
        { sv: "Hur många ledamöter finns i riksdagen?", ar: "كم عدد أعضاء البرلمان السويدي؟", options: ["250", "300", "349", "400"], answer: 2, explanation: "Sveriges riksdag består av 349 ledamöter." },
        { sv: "Vilken myndighet hanterar medborgarskap?", ar: "ما هي الهيئة المسؤولة عن دراسة طلبات الجنسية؟", options: ["Skatteverket", "Migrationsverket", "Polisen", "Försäkringskassan"], answer: 1, explanation: "Migrationsverket är den myndighet som prövar ansökningar om medborgarskap." },
        { sv: "Vilken dag är Sveriges nationaldag?", ar: "ما هو يوم العُطلة الوطنية في السويد؟", options: ["6 juni", "1 جنوري", "25 ديسمبر", "30 أبريل"], answer: 0, explanation: "Sveriges nationaldag firas den 6 juni varje år." },
        { sv: "Vad heter Sveriges statsminister?", ar: "ما اسم رئيس الحكومة السويدية؟", options: ["Statseministern", "Statsministern", "Riksdagsordföranden", "Kungen"], answer: 1, explanation: "Statsministern leder regeringens arbete." },
        { sv: "Vilka grundlagar har Sverige?", ar: "كم عدد الدساتير (القوانين الأساسية) في السويد؟", options: ["2", "3", "4", "5"], answer: 2, explanation: "Sverige har fyra grundlagar: Regeringsformen, Successionsordningen, Tryckfrihetsförordningen och Yttrandefrihetsgrundlagen." },
        { sv: "Vem utser statsministern i Sverige?", ar: "من الذي يقترح ويقوم بتعيين رئيس الوزراء في السويد؟", options: ["Kungen", "Riksdagens talman", "Högsta domstolen", "Folket direkt"], answer: 1, explanation: "Riksdagens talman lämnar ett förslag till statsminister som riksdagen röstar om." },
        { sv: "Vilken myndighet ansvarar för folkbokföring och skatter?", ar: "ما هي المسؤولة عن النفوس والضرائب في السويد؟", options: ["Migrationsverket", "Skatteverket", "Försäkringskassan", "Arbetsförmedlingen"], answer: 1, explanation: "Skatteverket ansvarar för folkbokföringen och skatter." },
        { sv: "Vad innebär principen om offentlighetens principer?", ar: "ماذا تعني مبدأ العلنية؟", options: ["Rätt att läsa myndigheternas handlingar", "Att alla möten är hemliga", "Att skatter är frivilliga", "Att polisen styr landet"], answer: 0, explanation: "Offentlighetsprincipen ger medborgare rätt att ta del av allmänna handlingar." },
        { sv: "Vilken ålder är det rösträtt till riksdagsval i Sverige?", ar: "ما هو عمر الاقتراع لانتخابات البرلمان في السويد؟", options: ["16 år", "18 år", "20 år", "21 år"], answer: 1, explanation: "Man har rösträtt det år man fyller 18 år." },
        { sv: "Vad är kommunens uppgift i Sverige?", ar: "ما هي مهمة البلدية في السويد؟", options: ["Besluta om rikets lagar", "Skola, barnomsorg och äldreomsorg", "Ansvara för försvaret", "Ge ut pass"], answer: 1, explanation: "Kommunerna ansvarar för lokal service som skolor och äldreomsorg." },
        { sv: "Vad är regionens huvudansvar?", ar: "ما هي المسؤولية الرئيسية للمحافظة أو الإقليم؟", options: ["Polis och rättsvsende", "Hälso- och sjukvård", "Vägar och trafik", "Kultur och idrott"], answer: 1, explanation: "Regionerna ansvarar främst för hälso- och sjukvård." },
        { sv: "Vilken grundlag skyddar yttrandefriheten i media?", ar: "أي قانون أساسي يحمي حرية التعبير في وسائل الإعلام؟", options: ["Regeringsformen", "Tryckfrihetsförordningen", "Successionsordningen", "Brottsbalken"], answer: 1, explanation: "Tryckfrihetsförordningen skyddar det tryckta ordet." }
    ];

    const allQuestions = [];
    for (let i = 0; i < 1000; i++) {
        let base = coreQuestions[i % coreQuestions.length];
        let modNum = Math.floor(i / 30) + 1;
        allQuestions.push({
            sv: `Fråga ${i+1} (Modul ${modNum}): ${base.sv}`,
            ar: `السؤال ${i+1} (المجموعة ${modNum}): ${base.ar}`,
            options: base.options,
            answer: base.answer,
            explanation: base.explanation
        });
    }

    let currentQuestionsList = [];
    let currentQuestionIndex = 0;
    let score = 0;
    let selectedOption = null;
    let isAnswered = false;
    let activeModuleId = null;

    let userResults = JSON.parse(localStorage.getItem('uhr_user_results')) || {};

    function initHomeMenu() {
        updateVisitorCounters();
        const menuContainer = document.getElementById("modules-menu");
        menuContainer.innerHTML = "";
        
        const totalModules = Math.ceil(allQuestions.length / 30);
        
        for (let m = 1; m <= totalModules; m++) {
            let savedScore = userResults[`module_${m}`];
            let badgeText = savedScore !== undefined ? `النتيجة: ${savedScore}/30` : `30 سؤالاً`;
            
            const btn = document.createElement("button");
            btn.className = "menu-btn";
            btn.innerHTML = `<span>📚 مجموعة رقم ${m} (Modul ${m})</span> <span class="badge">${badgeText}</span>`;
            btn.onclick = () => startModule(m);
            menuContainer.appendChild(btn);
        }
    }

    function startModule(modNum) {
        activeModuleId = `module_${modNum}`;
        const startIndex = (modNum - 1) * 30;
        const endIndex = startIndex + 30;
        currentQuestionsList = allQuestions.slice(startIndex, endIndex);
        startQuizSession();
    }

    function startQuickQuiz() {
        activeModuleId = null;
        let shuffled = [...allQuestions].sort(() => 0.5 - Math.random());
        currentQuestionsList = shuffled.slice(0, 10);
        startQuizSession();
    }

    function startQuizSession() {
        currentQuestionIndex = 0;
        score = 0;
        document.getElementById("home-view").classList.add("hidden");
        document.getElementById("quiz-view").classList.remove("hidden");
        loadQuestion();
    }

    function returnToHome() {
        document.getElementById("quiz-view").classList.add("hidden");
        document.getElementById("home-view").classList.remove("hidden");
        initHomeMenu();
    }

    function loadQuestion() {
        isAnswered = false;
        selectedOption = null;
        document.getElementById("explanation-box").style.display = "none";
        document.getElementById("submit-btn").innerText = "Svara / أجب";
        
        const q = currentQuestionsList[currentQuestionIndex];
        document.getElementById("q-sv").innerText = q.sv;
        document.getElementById("q-ar").innerText = q.ar;
        
        const optionsList = document.getElementById("options-container");
        optionsList.innerHTML = "";
        
        q.options.forEach((opt, index) => {
            const li = document.createElement("li");
            li.className = "option-item";
            li.innerText = opt;
            li.onclick = () => selectOption(index, li);
            optionsList.appendChild(li);
        });

        document.getElementById("question-counter").innerText = `Fråga ${currentQuestionIndex + 1} / ${currentQuestionsList.length}`;
        document.getElementById("progress").style.width = `${((currentQuestionIndex + 1) / currentQuestionsList.length) * 100}%`;
    }

    function selectOption(index, element) {
        if (isAnswered) return;
        document.querySelectorAll(".option-item").forEach(el => el.classList.remove("selected"));
        element.classList.add("selected");
        selectedOption = index;
    }

    function checkAnswer() {
        if (isAnswered) {
            currentQuestionIndex++;
            if (currentQuestionIndex < currentQuestionsList.length) {
                loadQuestion();
            } else {
                if (activeModuleId) {
                    userResults[activeModuleId] = score;
                    localStorage.setItem('uhr_user_results', JSON.stringify(userResults));
                }

                document.getElementById("quiz-view").innerHTML = `
                    <div style="text-align: center; padding: 25px;">
                        <h2 style="color: var(--primary-blue); margin-bottom: 10px;">نتيجة رائعة! / Resultat!</h2>
                        <p style="margin-bottom: 15px; font-size: 16px; color: #475569;">لقد أنهيت الاختبار بنجاح وتم حفظ نتيجتك.</p>
                        <p style="font-weight: bold; font-size: 22px; margin-bottom: 20px; color: var(--success);">النتيجة: ${score} / ${currentQuestionsList.length}</p>
                        <button class="btn" onclick="location.reload()">العودة للرئيسية / Huvudmeny</button>
                    </div>
                `;
            }
            return;
        }

        if (selectedOption === null) {
            alert("Vänligen välj ett alternativ! / الرجاء اختيار إجابة أولاً!");
            return;
        }

        isAnswered = true;
        const q = currentQuestionsList[currentQuestionIndex];
        const options = document.querySelectorAll(".option-item");

        if (selectedOption === q.answer) {
            options[selectedOption].classList.add("correct");
            score++;
            document.getElementById("score-text").innerText = `Poäng: ${score}`;
        } else {
            options[selectedOption].classList.add("incorrect");
            options[q.answer].classList.add("correct");
        }

        const expBox = document.getElementById("explanation-box");
        expBox.innerHTML = `<strong>Förklaring / توضيح:</strong><br>${q.explanation}`;
        expBox.style.display = "block";

        document.getElementById("submit-btn").innerText = "Nästa fråga / السؤال التالي";
    }

    window.onload = initHomeMenu;
</script>

</body>
</html>
